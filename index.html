<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IVRIT PRO — уроки івриту</title>
<style>
:root{--bg:#f7f5ef;--card:#fff;--tx:#1d2a3a;--mu:#5f6b7a;--ac:#1f5fbf;--ac2:#e8f0fc;--ok:#1b7f4b;--okb:#e0f4e9;--no:#b3261e;--nob:#fbe4e2;--bd:#d9d6cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--card:#1d2631;--tx:#e8edf3;--mu:#9aa7b6;--ac:#7fb0ff;--ac2:#22344d;--ok:#6fd6a0;--okb:#1b3a2b;--no:#ff9b94;--nob:#432220;--bd:#34404e;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:18px;margin:0 0 6px}
.nav,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.he{font-size:24px;direction:rtl;font-family:"Noto Sans Hebrew","David",serif;line-height:1.6}
.tr{color:var(--ac);font-style:italic}.uk,.mu{color:var(--mu);font-size:14px}
.quote{background:var(--ac2);border-left:4px solid var(--ac)}
.plan span{display:inline-block;background:var(--ac2);border-radius:99px;padding:1px 10px;margin:2px 4px 2px 0;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ln{padding:6px 0;border-top:1px solid var(--bd)}.ln:first-of-type{border:0}
.opt{display:block;width:100%;text-align:left;margin:5px 0}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.sp{padding:2px 8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><main>
<h1>IVRIT PRO · іврит з нуля</h1>
<div class="nav" id="nav"></div><div id="meta"></div><div class="tabs" id="tabs"></div><div id="view"></div>
</main>
<script src="data/lessons-data.js"></script>
<script>
const TABS=["Вислів і план","Теорія","Словник","Діалоги","Вправи","Тест"];
let cur=0,tab=0,qi=0,score=0,answered=false,mg=null;
const L_=()=>ivritCourses[cur];
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";u.rate=.75;speechSynthesis.speak(u)}catch(e){}}
function sp(t){return `<button class="sp" data-say="${t.replace(/"/g,"&quot;")}" aria-label="Озвучити">🔊</button>`}
function initMg(){const v=L_().vocabulary.slice().sort(()=>Math.random()-.5).slice(0,6);mg={v,r:v.map((_,i)=>i).sort(()=>Math.random()-.5),sel:null,done:[],msg:""}}
function nav(){document.getElementById("nav").innerHTML=ivritCourses.map((l,i)=>`<button class="${i==cur?"on":""}" data-l="${i}">${l.id}</button>`).join("");
document.getElementById("tabs").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" data-t="${i}">${t}</button>`).join("")}
function line(who,he,tr,uk){return `<div class="ln row"><div><span class="mu">${who}</span> <span class="he">${he}</span><div class="tr">${tr}</div><div class="uk">${uk}</div></div>${sp(he)}</div>`}
function exercises(){const m=mg;
const left=m.v.map((w,i)=>`<button class="opt he ${m.done.includes(i)?"ok":m.sel===i?"on":""}" data-ml="${i}">${w.he}</button>`).join("");
const right=m.r.map(i=>`<button class="opt ${m.done.includes(i)?"ok":""}" data-mr="${i}">${m.v[i].uk}</button>`).join("");
return `<div class="card"><h2>З’єднай слово з перекладом</h2><div class="mu">Натисни слово іврит, потім його переклад.</div><div class="cols"><div>${left}</div><div>${right}</div></div><p>${m.done.length==m.v.length?"🎉 Усі пари знайдено!":m.msg}</p><button data-act="mg">Почати знову</button></div>`}
function quiz(L){if(qi>=L.quiz.length)return `<div class="card"><h2>Результат: ${score} з ${L.quiz.length}</h2><button data-act="again">Пройти ще раз</button></div>`;
const q=L.quiz[qi];return `<div class="card"><div class="mu">Питання ${qi+1} з ${L.quiz.length}</div><p>${q.question}</p>${q.hebrew?`<div class="row"><div class="he">${q.hebrew}</div>${sp(q.hebrew)}</div>`:""}`+q.options.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join("")+`<div id="fb"></div></div>`}
function view(){const L=L_(),v=document.getElementById("view");nav();
document.getElementById("meta").innerHTML=`<div class="card"><h2>Урок ${L.id}. ${L.title}</h2><div class="he">${L.hebrewTitle}</div><div class="mu">${L.duration}</div></div>`;
let h="";
if(tab==0){const q=L.quote;h=`<div class="card quote"><div class="row"><div class="he">${q.he}</div>${sp(q.he)}</div><div class="tr">${q.tr}</div><div>${q.uk}</div><div class="mu">— ${q.who}</div></div><div class="card plan"><b>План: 90 хвилин</b><br><span>Вислів — 5</span><span>Теорія — 20</span><span>Словник — 15</span><span>Діалоги — 20</span><span>Вправи — 10</span><span>Тест — 20</span></div>`}
if(tab==1)h=L.theory.map(t=>`<div class="card">${t}</div>`).join("");
if(tab==2)h=`<div class="card">`+L.vocabulary.map(w=>`<div class="ln row"><div><span class="he">${w.he}</span><div class="tr">${w.tr}</div><div class="uk">${w.uk}</div></div>${sp(w.he)}</div>`).join("")+`</div>`;
if(tab==3){const g=[];L.dialogues.forEach(x=>{const t=g[g.length-1];if(t&&t.title==x.title)t.ex.push(x);else g.push({title:x.title,ex:[x]})});
h=g.map((d,n)=>`<div class="card"><b>${n+1}. ${d.title}</b>`+d.ex.map(x=>line("А:",x.speaker1,x.trans1,x.translat1)+line("Б:",x.speaker2,x.trans2,x.translat2)).join("")+`</div>`).join("")}
if(tab==4){if(!mg)initMg();h=exercises()}
if(tab==5)h=quiz(L);
v.innerHTML=h}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.say!==undefined)return say(d.say);
if(d.l!==undefined){cur=+d.l;tab=0;qi=0;score=0;answered=false;mg=null;return view()}
if(d.t!==undefined){tab=+d.t;return view()}
if(d.act=="again"){qi=0;score=0;answered=false;return view()}
if(d.act=="next"){qi++;answered=false;return view()}
if(d.act=="mg"){initMg();return view()}
if(d.ml!==undefined&&!mg.done.includes(+d.ml)){mg.sel=+d.ml;mg.msg="";return view()}
if(d.mr!==undefined&&mg.sel!==null){const i=+d.mr;if(i===mg.sel){mg.done.push(i);mg.msg="✅ Правильно!"}else mg.msg="❌ Спробуй ще";mg.sel=null;return view()}
if(d.o!==undefined&&!answered){answered=true;const q=L_().quiz[qi],o=+d.o,ok=o==q.correct;if(ok)score++;
document.querySelectorAll(".opt").forEach((x,i)=>{if(i==q.correct)x.classList.add("ok");else if(i==o)x.classList.add("no")});
document.getElementById("fb").innerHTML=`<p>${ok?"✅ Правильно!":"❌ Правильна відповідь: "+q.options[q.correct]}</p><button data-act="next">${qi+1<L_().quiz.length?"Далі":"Результат"}</button>`}});
view();
</script></body></html>
