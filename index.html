<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVRIT PRO — Вивчення івриту</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --jewish-blue: #0038b8;
            --jewish-gold: #d4af37;
            --bg-pergamum: #fdfbf7;
            --text-main: #2c3e50;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-pergamum);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        header {
            background: linear-gradient(135deg, var(--jewish-blue), #00227a);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 5px solid var(--jewish-gold);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0, 56, 184, 0.2);
        }

        header h1 { font-size: 2.2rem; letter-spacing: 2px; margin-bottom: 5px; }
        header p { font-size: 1.1rem; opacity: 0.9; }
        .header-symbol { font-size: 24px; color: var(--jewish-gold); margin-bottom: 10px; display: inline-block; }

        .container { max-width: 850px; margin: 30px auto; padding: 0 20px; }

        .lesson-card {
            background: var(--card-bg);
            border: 2px solid var(--jewish-gold);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 18px rgba(0, 56, 184, 0.06);
            position: relative;
        }

        .lesson-card::before {
            content: "✡";
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--jewish-blue);
            font-size: 22px;
            opacity: 0.85;
        }

        .lesson-card h2 { font-size: 1.4rem; color: var(--jewish-blue); margin-bottom: 8px; padding-right: 30px; }
        .hebrew-sub { font-size: 1.25rem; font-weight: 700; color: var(--jewish-gold); margin-bottom: 12px; }
        
        .btn {
            background-color: var(--jewish-blue);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Assistant', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #002a8c; }
        .btn-gold { background-color: var(--jewish-gold); color: #1a1a1a; font-weight: 600; }
        .btn-gold:hover { background-color: #bfa030; }

        /* Внутрішні блоки відкритого уроку */
        .section-box {
            background: var(--card-bg);
            border: 2px solid var(--jewish-gold);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            color: var(--jewish-blue);
            border-bottom: 2px solid var(--jewish-gold);
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        .theory-item { margin-bottom: 12px; padding-left: 15px; border-left: 3px solid var(--jewish-blue); }
        
        .dialogue-pair {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid var(--jewish-gold);
        }
        .he-text { font-size: 1.25rem; font-weight: 700; color: var(--jewish-blue); direction: rtl; text-align: right; }
        .tr-text { font-style: italic; color: #666; font-size: 0.95rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: left; }
        th { background-color: var(--jewish-blue); color: white; }
        td.he-cell { font-size: 1.2rem; font-weight: bold; color: var(--jewish-blue); direction: rtl; text-align: right; }

        .quiz-item { margin-bottom: 18px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .quiz-opt {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 15px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-family: 'Assistant', sans-serif;
            font-size: 1rem;
        }
        .quiz-opt:hover { background: #f0f4ff; border-color: var(--jewish-blue); }
        .quiz-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: bold; }
        .quiz-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }

        footer { text-align: center; margin-top: 50px; color: #7f8c8d; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-symbol">✡</div>
        <h1>IVRIT PRO</h1>
        <p>Інтерактивний академічний курс івриту</p>
    </header>

    <div class="container" id="app-container">
        <!-- Сюди завантажується список уроків або обраний урок -->
    </div>

    <footer>
        <p>&copy; 2026 IVRIT PRO. Усі права захищено.</p>
    </footer>

    <!-- Підключаємо дані уроків -->
    <script src="data/lessons-data.js"></script>
    <script>
        const container = document.getElementById("app-container");

        // Функція показу списку всіх уроків
        function renderCourseList() {
            if (typeof ivritCourses === "undefined" || !Array.isArray(ivritCourses)) {
                container.innerHTML = `<div class="section-box" style="color:red; text-align:center;">
                    Помилка завантаження файлу <b>data/lessons-data.js</b>. Перевірте, чи правильно закрита дужка <code>];</code> в кінці файлу даних.
                </div>`;
                return;
            }

            let html = "";
            ivritCourses.forEach(lesson => {
                const desc = (lesson.theory && lesson.theory[0]) 
                    ? lesson.theory[0].replace(/\*\*/g, "") 
                    : "Інтерактивний урок івриту: теорія, діалоги, словник та тестування.";

                html += `
                    <div class="lesson-card">
                        <h2>${lesson.title}</h2>
                        <div class="hebrew-sub">${lesson.hebrewTitle || ''}</div>
                        <p style="margin-bottom: 15px; color: #555;">${desc}</p>
                        <button class="btn" onclick="openLesson(${lesson.id})">
                            <i class="fa-solid fa-book-open"></i> Відкрити урок
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
            window.scrollTo(0, 0);
        }

        // Функція відкриття конкретного уроку прямо на сторінці
        function openLesson(id) {
            const lesson = ivritCourses.find(l => l.id === id);
            if (!lesson) return;

            let theoryHtml = (lesson.theory || []).map(p => `<div class="theory-item">${p}</div>`).join("");
            
            let dialoguesHtml = (lesson.dialogues || []).map(d => `
                <div class="dialogue-pair">
                    <div class="he-text">${d.speaker1}</div>
                    <div class="tr-text">${d.trans1} — <b>${d.translat1}</b></div>
                    <hr style="margin: 8px 0; border: 0; border-top: 1px dashed #ccc;">
                    <div class="he-text">${d.speaker2}</div>
                    <div class="tr-text">${d.trans2} — <b>${d.translat2}</b></div>
                </div>
            `).join("");

            let vocabHtml = (lesson.vocabulary || []).map(v => `
                <tr>
                    <td class="he-cell">${v.he}</td>
                    <td><i>${v.tr}</i></td>
                    <td>${v.uk}</td>
                </tr>
            `).join("");

            let quizHtml = (lesson.quiz || []).map((q, qIdx) => {
                let opts = q.options.map((opt, oIdx) => 
                    `<button class="quiz-opt" onclick="checkAnswer(this, ${oIdx === q.correct})">${opt}</button>`
                ).join("");
                return `
                    <div class="quiz-item">
                        <p><b>${qIdx + 1}. ${q.question}</b></p>
                        ${q.hebrew ? `<p class="he-text" style="font-size:1.1rem; margin: 5px 0;">${q.hebrew}</p>` : ""}
                        <div>${opts}</div>
                    </div>
                `;
            }).join("");

            container.innerHTML = `
                <button class="btn btn-gold" onclick="renderCourseList()" style="margin-bottom: 20px;">
                    <i class="fa-solid fa-arrow-left"></i> Назад до всіх уроків
                </button>

                <div class="lesson-card">
                    <h2>${lesson.title}</h2>
                    <div class="hebrew-sub">${lesson.hebrewTitle || ''}</div>
                    <p>⏱ Тривалість: ${lesson.duration || '90 хвилин'}</p>
                </div>

                <div class="section-box">
                    <h3 class="section-title">✡ Теорія та граматика</h3>
                    ${theoryHtml}
                </div>

                <div class="section-box">
                    <h3 class="section-title">💬 Діалоги</h3>
                    ${dialoguesHtml}
                </div>

                <div class="section-box">
                    <h3 class="section-title">📖 Словник уроку</h3>
                    <table>
                        <thead><tr><th>Іврит</th><th>Транскрипція</th><th>Переклад</th></tr></thead>
                        <tbody>${vocabHtml}</tbody>
                    </table>
                </div>

                <div class="section-box">
                    <h3 class="section-title">🧠 Контрольний тест</h3>
                    ${quizHtml}
                </div>

                <button class="btn btn-gold" onclick="renderCourseList()">
                    <i class="fa-solid fa-arrow-left"></i> Повернутися до списку уроків
                </button>
            `;
            window.scrollTo(0, 0);
        }

        // Перевірка відповіді в тесті
        function checkAnswer(btn, isCorrect) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll(".quiz-opt");
            buttons.forEach(b => b.disabled = true);
            if (isCorrect) {
                btn.classList.add("correct");
            } else {
                btn.classList.add("wrong");
            }
        }

        document.addEventListener("DOMContentLoaded", renderCourseList);
    </script>
</body>
</html>
