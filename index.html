<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVRIT PRO — Єврейська академія івриту</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0038b8;--dark:#001c63;--gold:#c69214;--lgold:#e6c25b;--bg:#fbf5e8;--card:#fffdf9;--tan:#dec7a1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Assistant',sans-serif;background:var(--bg);color:#24292f;line-height:1.6;padding-bottom:50px}
header{background:linear-gradient(160deg,var(--dark),var(--blue) 60%,#0047e0);color:#fff;text-align:center;padding:18px 20px 22px;border-bottom:6px solid var(--gold);box-shadow:0 8px 25px rgba(0,28,99,.35)}
header h1{font-size:2.1rem;letter-spacing:3px;font-weight:800;cursor:pointer}
header p{color:#f3e8c8}
.motto{font-family:'Frank Ruhl Libre',serif;font-size:1.2rem;color:var(--lgold)}
.container{max-width:860px;margin:22px auto;padding:0 15px}
.hero{border-radius:14px;overflow:hidden;border:2px solid var(--gold);margin-bottom:18px;box-shadow:0 6px 20px rgba(0,56,184,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:20px}
.lb{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:9px 10px;cursor:pointer;font:inherit;font-size:.95rem;font-weight:600;color:var(--dark)}
.lb b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.9rem}
.lb.on{background:var(--blue);color:#fff}.lb.on b{background:var(--lgold);color:var(--dark)}
.box{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:22px;margin-bottom:22px;box-shadow:0 6px 20px rgba(198,146,20,.15)}
.box h2{color:var(--blue);font-size:1.5rem}
.htitle{font-family:'Frank Ruhl Libre',serif;font-size:1.5rem;color:var(--gold);font-weight:700;direction:rtl;text-align:right;margin-bottom:10px}
.quote{background:linear-gradient(135deg,#eef3ff,#fbf1d4);border:2px solid var(--gold);border-radius:12px;padding:16px;margin:14px 0 20px;text-align:center}
.quote .he{font-family:'Frank Ruhl Libre',serif;font-size:1.6rem;font-weight:700;color:var(--blue);direction:rtl}
.quote .tr{font-style:italic;color:#555}.quote .who{color:#7d6b4f;font-size:.95rem;margin-top:4px}
.btn{background:linear-gradient(135deg,var(--blue),var(--dark));color:#fff;border:1px solid var(--gold);padding:11px 24px;border-radius:8px;cursor:pointer;font:inherit;font-weight:700;margin-top:12px}
.audio{background:#eef3ff;border:1.5px solid var(--blue);color:var(--blue);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;flex-shrink:0}
.audio:active{background:var(--blue);color:#fff}
.st{color:var(--blue);border-bottom:2px solid var(--gold);padding-bottom:8px;margin:22px 0 14px;font-size:1.3rem;font-weight:800}
.th{margin-bottom:12px;padding:10px 14px;background:#faf4e6;border-left:4px solid var(--blue);border-radius:0 8px 8px 0}
.dt{margin:14px 0 6px;font-weight:700;color:var(--gold)}
.dlg{background:#fdf9f0;padding:14px;border-radius:10px;margin-bottom:10px;border:1px solid var(--tan);border-right:5px solid var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.he-d{font-family:'Frank Ruhl Libre',serif;font-size:1.4rem;font-weight:700;color:var(--blue);direction:rtl;text-align:right;flex-grow:1}
.sub{font-style:italic;color:#555;margin-top:6px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--tan)}
th,td{border:1px solid var(--tan);padding:8px;text-align:left;vertical-align:middle}
th{background:var(--blue);color:#fff}
td.he-c{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--blue);direction:rtl;text-align:right;font-size:1.3rem}
.qi{margin-bottom:18px;padding-bottom:12px;border-bottom:1px dashed var(--tan)}
.qo{display:block;width:100%;text-align:left;padding:10px 14px;margin:7px 0;border:1.5px solid var(--tan);border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-weight:600}
.qo.correct{background:#d4edda;border-color:#28a745;color:#155724}.qo.wrong{background:#f8d7da;border-color:#dc3545;color:#721c24}
footer{text-align:center;color:#7d6b4f;margin-top:30px;padding:16px;border-top:2px solid var(--tan)}
</style>
</head>
<body>
<header><h1 data-home="1">✡ IVRIT PRO ✡</h1><p>Єврейський академічний курс івриту</p><div class="motto">בְּהַצְלָחָה בַּלִּימּוּדִים • Успіхів у навчанні</div></header>
<div class="container" id="app"></div>
<footer>✡ 🕎 ✡<p>&copy; 2026 IVRIT PRO</p></footer>
<script src="data/lessons-data.js" onerror="var s=document.createElement('script');s.src='lessons-data.js';s.onload=boot;document.head.appendChild(s)"></script>
<script>
const app=document.getElementById("app");let cur=-1,qi=0;
const HERO=`<div class="hero"><svg viewBox="0 0 640 280" style="display:block;width:100%;height:auto" role="img" aria-label="Запрошення вивчати іврит"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#001c63"/><stop offset="1" stop-color="#0047e0"/></linearGradient></defs><rect width="640" height="280" fill="url(#hg)"/><rect y="16" width="640" height="6" fill="#fff" opacity=".85"/><rect y="28" width="640" height="3" fill="#fff" opacity=".55"/><rect y="249" width="640" height="3" fill="#fff" opacity=".55"/><rect y="258" width="640" height="6" fill="#fff" opacity=".85"/><g fill="#fff" opacity=".09" font-size="70" font-family="'Frank Ruhl Libre',serif"><text x="250" y="90">א</text><text x="330" y="235">ב</text><text x="520" y="80">ש</text><text x="580" y="225">ל</text><text x="190" y="225">ד</text><text x="440" y="240">ם</text></g><g fill="none" stroke="#e6c25b" stroke-width="5" stroke-linejoin="round"><polygon points="110,82 160,168 60,168"/><polygon points="110,198 60,112 160,112"/></g><circle cx="110" cy="140" r="86" fill="none" stroke="#fff" stroke-width="1.5" opacity=".35"/><g text-anchor="middle" font-family="'Frank Ruhl Libre',serif" direction="rtl"><text x="395" y="122" font-size="68" fill="#fff">שָׁלוֹם</text><text x="395" y="172" font-size="30" fill="#e6c25b">בּוֹאוּ לִלְמֹד עִבְרִית</text></g><text x="395" y="208" text-anchor="middle" font-size="21" font-family="Assistant,sans-serif" fill="#fff">Запрошуємо вивчати іврит</text><text x="395" y="234" text-anchor="middle" font-size="13" font-family="Assistant,sans-serif" fill="#fff" opacity=".85">IVRIT PRO · 15 уроків · з озвученням</text></svg></div>`;
function say(t){if(!("speechSynthesis" in window))return alert("Ваш браузер не підтримує озвучення.");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";u.rate=.85;const v=speechSynthesis.getVoices().find(v=>/^(he|iw)/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function ab(t){return `<button class="audio" data-say="${(t||"").replace(/"/g,"&quot;")}" title="Прослухати">🔊</button>`}
function grid(){return `<div class="grid">`+ivritCourses.map((l,i)=>`<button class="lb ${i==cur?"on":""}" data-l="${i}"><b>${l.id}</b><span>${l.title}</span></button>`).join("")+`</div>`}
function home(){cur=-1;app.innerHTML=HERO+grid();scrollTo(0,0)}
function open_(i){cur=i;const L=ivritCourses[i],q=L.quote;
const th=(L.theory||[]).filter(t=>typeof t!=="string"||!t.startsWith("📜")).map(t=>`<div class="th">${typeof t==="string"?t:(t.text||t.content||JSON.stringify(t))}</div>`).join("");
let last="";const dl=(L.dialogues||[]).map(d=>{const h1=d.speaker1||d.he||"",t=(d.title&&d.title!==last)?`<div class="dt">${last=d.title}</div>`:"";
return t+`<div class="dlg"><div class="top">${ab(h1)}<div class="he-d">${h1}</div></div><div class="sub">${d.trans1||d.tr||""} — <b>${d.translat1||d.uk||""}</b></div>`+(d.speaker2?`<hr style="margin:10px 0;border:0;border-top:1px dashed #dec7a1"><div class="top">${ab(d.speaker2)}<div class="he-d">${d.speaker2}</div></div><div class="sub">${d.trans2||""} — <b>${d.translat2||""}</b></div>`:"")+`</div>`}).join("");
const ph=(L.phrases||[]).map(p=>`<div class="dlg"><div class="top">${ab(p.he)}<div class="he-d">${p.he}</div></div><div class="sub">${p.tr} — <b>${p.uk}</b></div></div>`).join("");
const vr=(L.vocabulary||[]).map(v=>`<tr><td style="width:46px;text-align:center">${ab(v.he)}</td><td class="he-c">${v.he}</td><td><i>${v.tr}</i></td><td>${v.uk}</td></tr>`).join("");
const qz=(L.quiz||[]).map((x,n)=>`<div class="qi"><p><b>${n+1}. ${x.question}</b></p>${x.hebrew?`<div class="top" style="justify-content:flex-end;margin:8px 0"><span class="he-d" style="flex-grow:0">${x.hebrew}</span>${ab(x.hebrew)}</div>`:""}`+x.options.map((o,k)=>`<button class="qo" data-c="${k==x.correct?1:0}">${o}</button>`).join("")+`</div>`).join("");
app.innerHTML=grid()+`<div class="box"><h2>Урок ${L.id}. ${L.title}</h2><div class="htitle">${L.hebrewTitle||""}</div><div style="color:#666;font-weight:600">⏱ ${L.duration||"90 хвилин"}</div>`+
(q?`<div class="quote"><div class="top" style="justify-content:center">${ab(q.he)}<div class="he">${q.he}</div></div><div class="tr">${q.tr}</div><div>«${q.uk}»</div><div class="who">— ${q.who}</div></div>`:"")+
`<div class="st">✡ Теорія та граматика</div>${th}`+
(dl?`<div class="st">🔊 Діалоги</div>${dl}`:"")+(ph?`<div class="st">💬 Фрази</div>${ph}`:"")+(vr?`<div class="st">📖 Словник (${L.vocabulary.length})</div><table><thead><tr><th>Звук</th><th style="text-align:right">Іврит</th><th>Транскрипція</th><th>Переклад</th></tr></thead><tbody>${vr}</tbody></table>`:"")+
`<div class="st">🧠 Контрольний тест</div>${qz||"<p>Тест готується.</p>"}</div><button class="btn" data-home="1" style="width:100%;padding:14px">← На головну</button>`;scrollTo(0,0)}
function boot(){if(typeof ivritCourses==="undefined"||!ivritCourses.length){app.innerHTML=`<div class="box" style="color:#a00">Помилка: не вдалося завантажити <code>data/lessons-data.js</code>. Перевірте, що папка <b>data</b> лежить поруч з index.html.</div>`;return}home()}
document.addEventListener("click",e=>{const b=e.target.closest("button,h1");if(!b)return;const d=b.dataset;
if(d.say!==undefined)return say(d.say);if(d.home)return home();if(d.l!==undefined)return open_(+d.l);
if(b.classList.contains("qo")){b.parentElement.querySelectorAll(".qo").forEach(x=>x.disabled=true);b.classList.add(d.c=="1"?"correct":"wrong");if(d.c!="1"){const r=b.parentElement.querySelector('[data-c="1"]');if(r)r.classList.add("correct")}}});
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
window.addEventListener("load",()=>{if(typeof ivritCourses!=="undefined")boot();else setTimeout(()=>{if(typeof ivritCourses==="undefined")boot()},1500)});
</script>
</body>
</html>
