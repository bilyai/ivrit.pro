<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVRIT PRO — Професійний курс івриту</title>
  <style>
    :root {
      --bg-primary: #fbf9f4; /* Теплий кремовий колір пергаменту */
      --bg-card: #ffffff;
      --accent-gold: #c59b27; /* Благородний золотистий акцент */
      --israel-blue: #0038b8; /* Ізраїльський синій */
      --text-main: #2c2c2c;
      --border-color: #e6dec9;
    }

    body {
      background-color: var(--bg-primary);
      /* Тонкий візерунок фактурного паперу/піску */
      background-image: radial-gradient(#e6dec9 0.75px, transparent 0.75px), radial-gradient(#e6dec9 0.75px, var(--bg-primary) 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(135deg, #0038b8, #002075);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border-bottom: 3px solid var(--accent-gold);
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 24px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.9;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* Навігація по уроках */
    .nav-lessons {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .lesson-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .lesson-btn.active {
      background: var(--israel-blue);
      color: white;
      border-color: var(--israel-blue);
      box-shadow: 0 2px 8px rgba(0, 56, 184, 0.3);
    }

    /* Картки блоків */
    .lesson-card, .theory-box, .dialogue-box, .vocab-grid, .quiz-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(197, 155, 39, 0.06);
      position: relative;
    }

    /* Тонка золотисто-синя смужка зверху карток для єврейського колориту */
    .lesson-card::before, .theory-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--israel-blue), var(--accent-gold), var(--israel-blue));
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .hebrew-title {
      font-family: "David", "Frank Ruehl", "Times New Roman", serif;
      font-size: 28px;
      color: var(--israel-blue);
      text-align: right;
      margin: 10px 0;
    }

    /* Кнопки озвучки та взаємодії */
    button.speak-btn {
      background: var(--accent-gold);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button.speak-btn:hover {
      background: #b08920;
    }
  </style>
</head>
<body>

  <header>
    <h1>🇮🇱 IVRIT PRO</h1>
    <div class="subtitle">Професійний курс івриту • Ручна якість • Озвучка</div>
  </header>

  <div class="container">
    <!-- Кнопки вибору уроків генеруються динамічно або виводяться тут -->
    <div class="nav-lessons" id="navContainer">
      <!-- Тут з'являтимуться кнопки Урок 1, 2, 3, 4, 5 -->
    </div>

    <!-- Основний контент уроку -->
    <div id="lessonContent">
      <!-- Динамічний контент із lessons-data.js -->
    </div>
  </div>

  <!-- Підключаємо файл із базою даних уроків -->
  <script src="lessons-data.js"></script>
  <script>
    // Тут міститься логіка рендерингу уроків, яку ви використовуєте в додатку
    console.log("IVRIT PRO завантажено успішно!");
  </script>
</body>
</html>
