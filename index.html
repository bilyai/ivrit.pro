<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVRIT PRO — Єврейська академія івриту</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --jewish-blue: #0038b8;
            --jewish-dark-blue: #001c63;
            --jewish-gold: #c69214;
            --jewish-light-gold: #e6c25b;
            --bg-pergamum: #fbf5e8;
            --card-bg: #fffdf9;
            --border-tan: #dec7a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-pergamum);
            background-image: 
                radial-gradient(rgba(198, 146, 20, 0.12) 1px, transparent 1px),
                radial-gradient(rgba(0, 56, 184, 0.06) 1px, var(--bg-pergamum) 1px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            color: #24292f;
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(160deg, var(--jewish-dark-blue) 0%, var(--jewish-blue) 60%, #0047e0 100%);
            color: white;
            text-align: center;
            padding: 25px 20px 35px;
            position: relative;
            border-bottom: 6px solid var(--jewish-gold);
            box-shadow: 0 8px 25px rgba(0, 28, 99, 0.35);
            overflow: hidden;
        }

        header::before {
            content: "";
            display: block;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--jewish-gold),
                var(--jewish-gold) 20px,
                transparent 20px,
                transparent 28px
            );
            margin-bottom: 18px;
            opacity: 0.85;
        }

        .jewish-emblems {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            font-size: 28px;
            color: var(--jewish-light-gold);
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        header h1 {
            font-size: 2.3rem;
            letter-spacing: 3px;
            font-weight: 800;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        header p {
            margin-top: 6px;
            font-size: 1.1rem;
            color: #f3e8c8;
            letter-spacing: 0.5px;
        }

        .hebrew-motto {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 1.25rem;
            color: var(--jewish-light-gold);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .container {
            max-width: 820px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 2px solid var(--jewish-gold);
            outline: 4px solid var(--card-bg);
            box-shadow: 0 0 0 5px rgba(198, 146, 20, 0.35), 0 8px 20px rgba(0, 56, 184, 0.08);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 28px;
            position: relative;
        }

        .lesson-card::after {
            content: "✡";
            position: absolute;
            top: 16px;
            right: 20px;
            color: var(--jewish-blue);
            font-size: 26px;
            opacity: 0.85;
        }

        .lesson-card h2 {
            color: var(--jewish-blue);
            font-size: 1.35rem;
            margin-bottom: 6px;
            padding-right: 35px;
            font-weight: 700;
        }

        .hebrew-title {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 1.45rem;
            color: var(--jewish-gold);
            font-weight: 700;
            direction: rtl;
            text-align: right;
            margin-bottom: 12px;
        }

        .btn {
            background: linear-gradient(135deg, var(--jewish-blue), var(--jewish-dark-blue));
            color: white;
            border: 1px solid var(--jewish-gold);
            padding: 11px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-family: 'Assistant', sans-serif;
            font-weight: 700;
            display: inline-block;
            margin-top: 12px;
            box-shadow: 0 4px 10px rgba(0, 56, 184, 0.25);
            text-decoration: none;
        }

        .btn:active { transform: scale(0.98); }

        .btn-gold {
            background: linear-gradient(135deg, #d6a11e, #b07f0c);
            color: #fff;
            border: none;
        }

        .audio-btn {
            background: #eef3ff;
            border: 1.5px solid var(--jewish-blue);
            color: var(--jewish-blue);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .audio-btn:hover, .audio-btn:active {
            background: var(--jewish-blue);
            color: white;
            transform: scale(1.08);
        }

        .lesson-content-box {
            background: var(--card-bg);
            border: 2px solid var(--jewish-gold);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(198, 146, 20, 0.15);
        }

        /* Блок цитати на уроці */
        .lesson-quote-box {
            background: #fdf8ee;
            border: 1.5px solid var(--jewish-gold);
            border-radius: 10px;
            padding: 16px;
            margin: 18px 0 22px 0;
            box-shadow: inset 0 1px 4px rgba(198, 146, 20, 0.1);
        }

        .ornament-divider {
            text-align: center;
            color: var(--jewish-gold);
            font-size: 1.2rem;
            letter-spacing: 8px;
            margin: 22px 0 10px;
        }

        .section-title {
            color: var(--jewish-blue);
            border-bottom: 2px solid var(--jewish-gold);
            padding-bottom: 8px;
            margin-top: 15px;
            margin-bottom: 16px;
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theory-p {
            margin-bottom: 12px;
            padding: 10px 14px;
            background: #faf4e6;
            border-left: 4px solid var(--jewish-blue);
            border-radius: 0 8px 8px 0;
            font-size: 1.05rem;
        }

        .dialogue-box {
            background: #fdf9f0;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-tan);
            border-right: 5px solid var(--jewish-gold);
        }

        .dialogue-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .he-dialogue {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--jewish-blue);
            direction: rtl;
            text-align: right;
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-tan);
        }

        th, td {
            border: 1px solid var(--border-tan);
            padding: 10px 10px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: var(--jewish-blue);
            color: white;
            font-size: 1rem;
        }

        td.he-col {
            font-family: 'Frank Ruhl Libre', serif;
            font-weight: 700;
            color: var(--jewish-blue);
            direction: rtl;
            text-align: right;
            font-size: 1.3rem;
        }

        .quiz-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-tan);
        }

        .quiz-opt {
            display: block;
            width: 100%;
            text-align: left;
            padding: 11px 15px;
            margin: 8px 0;
            border: 1.5px solid var(--border-tan);
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-family: 'Assistant', sans-serif;
            font-size: 1rem;
            font-weight: 600;
        }

        .quiz-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .quiz-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }

        footer {
            text-align: center;
            color: #7d6b4f;
            margin-top: 40px;
            font-size: 0.95rem;
            padding: 20px;
            border-top: 2px solid var(--border-tan);
        }
    </style>
</head>
<body>

    <header>
        <div class="jewish-emblems">
            <span>✡</span>
            <span>✡</span>
            <span>✡</span>
        </div>
        <h1>IVRIT PRO</h1>
        <p>Єврейський академічний курс івриту</p>
        <div class="hebrew-motto">בְּהַצְלָחָה בַּלִּימּוּדִים • Успіхів у навчанні</div>
    </header>

    <div class="container" id="app-container"></div>

    <footer>
        <div>✡ ✡ ✡</div>
        <p style="margin-top: 6px;">&copy; 2026 IVRIT PRO. Усі права захищено.</p>
    </footer>

    <script src="lessons-data.js"></script>
    <script>
        const container = document.getElementById("app-container");

        function speakHebrew(text) {
            if (!('speechSynthesis' in window)) {
                alert("Ваш браузер не підтримує голосове озвучення.");
                return;
            }
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/['"«»]/g, "");
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'he-IL';
            utterance.rate = 0.85;
            
            const voices = window.speechSynthesis.getVoices();
            const hebrewVoice = voices.find(v => v.lang.includes('he') || v.lang.includes('iw'));
            if (hebrewVoice) {
                utterance.voice = hebrewVoice;
            }
            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        function escapeQuotes(str) {
            return (str || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
        }

        function renderList() {
            if (typeof ivritCourses === "undefined" || !Array.isArray(ivritCourses)) {
                container.innerHTML = `<div style="text-align:center; color:red; padding:20px;">Помилка: не вдалося знайти файл <code>lessons-data.js</code>.</div>`;
                return;
            }

            let html = "";
            ivritCourses.forEach(lesson => {
                let desc = (lesson.theory && lesson.theory[0]) ? lesson.theory[0] : "Інтерактивний урок івриту.";
                html += `
                    <div class="lesson-card">
                        <h2>${lesson.title}</h2>
                        <div class="hebrew-title">${lesson.hebrewTitle || ''}</div>
                        <p style="color: #444; font-size: 1.05rem;">${desc}</p>
                        <button class="btn" onclick="openLesson(${lesson.id})">Відкрити урок ✡</button>
                    </div>
                `;
            });
            container.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function openLesson(id) {
            const lesson = ivritCourses.find(l => l.id === id);
            if (!lesson) return;

            let theoryHtml = (lesson.theory || []).map(t => `<div class="theory-p">${t}</div>`).join("");
            
            // Якщо у файлі уроку задана цитата — виводимо її красивим блоком
            let quoteHtml = "";
            if (lesson.quote) {
                quoteHtml = `
                    <div class="lesson-quote-box">
                        <div style="font-size: 0.85rem; color: #8c7b60; margin-bottom: 6px; font-weight: 700; text-transform: uppercase;">💡 Мудрість єврейського народу</div>
                        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                            <button class="audio-btn" title="Прослухати" onclick="speakHebrew('${escapeQuotes(lesson.quote.he)}')">🔊</button>
                            <div class="he-dialogue" style="font-size: 1.35rem;">${lesson.quote.he}</div>
                        </div>
                        <div style="font-style: italic; color: #555; font-size: 0.95rem; text-align: right; margin-top: 6px; border-top: 1px dashed var(--border-tan); pt-1;">
                            ${lesson.quote.tr} — <b>${lesson.quote.uk}</b>
                        </div>
                    </div>
                `;
            }

            let dialoguesHtml = (lesson.dialogues || []).map(d => {
                const he1 = d.he || d.speaker1 || "";
                const tr1 = d.tr || d.trans1 || "";
                const uk1 = d.uk || d.translat1 || "";

                let block = `
                    <div class="dialogue-box">
                        <div class="dialogue-top">
                            <button class="audio-btn" title="Прослухати" onclick="speakHebrew('${escapeQuotes(he1)}')">🔊</button>
                            <div class="he-dialogue">${he1}</div>
                        </div>
                        <div style="font-style: italic; color: #555; margin-top: 6px; font-size: 1rem;">${tr1} — <b>${uk1}</b></div>
                `;

                if (d.speaker2) {
                    block += `
                        <hr style="margin: 10px 0; border: 0; border-top: 1px dashed #dec7a1;">
                        <div class="dialogue-top">
                            <button class="audio-btn" title="Прослухати" onclick="speakHebrew('${escapeQuotes(d.speaker2)}')">🔊</button>
                            <div class="he-dialogue">${d.speaker2}</div>
                        </div>
                        <div style="font-style: italic; color: #555; margin-top: 6px; font-size: 1rem;">${d.trans2 || ''} — <b>${d.translat2 || ''}</b></div>
                    `;
                }

                block += `</div>`;
                return block;
            }).join("");

            let vocabRows = (lesson.vocabulary || []).map(v => `
                <tr>
                    <td style="width: 48px; text-align: center;">
                        <button class="audio-btn" title="Прослухати" onclick="speakHebrew('${escapeQuotes(v.he)}')">🔊</button>
                    </td>
                    <td class="he-col">${v.he}</td>
                    <td><i>${v.tr}</i></td>
                    <td>${v.uk}</td>
                </tr>
            `).join("");

            let quizHtml = (lesson.quiz && lesson.quiz.length > 0) ? lesson.quiz.map((q, qIdx) => {
                let opts = q.options.map((opt, oIdx) => 
                    `<button class="quiz-opt" onclick="checkAns(this, ${oIdx === q.correct})">${opt}</button>`
                ).join("");
                return `
                    <div class="quiz-item">
                        <p><b>${qIdx + 1}. ${q.question}</b></p>
                        ${q.hebrew ? `
                            <div style="display:flex; align-items:center; justify-content:flex-end; gap:10px; margin:8px 0;">
                                <span class="he-dialogue" style="font-size:1.25rem;">${q.hebrew}</span>
                                <button class="audio-btn" onclick="speakHebrew('${escapeQuotes(q.hebrew)}')">🔊</button>
                            </div>` : ''}
                        <div>${opts}</div>
                    </div>
                `;
            }).join("") : "<p style='color: #666; font-style: italic;'>У цьому уроці тестові завдання готуються до публікації.</p>";

            container.innerHTML = `
                <button class="btn btn-gold" onclick="renderList()" style="margin-bottom: 20px;">← Назад до списку уроків</button>
                
                <div class="lesson-content-box">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                        <h2 style="color: var(--jewish-blue); margin-bottom: 5px; font-size: 1.5rem;">${lesson.title}</h2>
                        <span style="font-size: 26px; color: var(--jewish-gold);">✡</span>
                    </div>
                    <div class="hebrew-title" style="font-size: 1.5rem; margin-bottom: 6px;">${lesson.hebrewTitle || ''}</div>
                    <p style="color: #666; margin-bottom: 10px; font-weight: 600;">⏱ Тривалість: ${lesson.duration || '90 хвилин'}</p>
                    
                    ${quoteHtml}

                    <div class="section-title">✡ Теорія та граматика</div>
                    ${theoryHtml}

                    ${dialoguesHtml ? `
                        <div class="ornament-divider">• ✡ •</div>
                        <div class="section-title">🔊 Діалоги та фрази</div>
                        ${dialoguesHtml}
                    ` : ''}

                    ${vocabRows ? `
                        <div class="ornament-divider">• ✡ •</div>
                        <div class="section-title">📖 Словник уроку</div>
                        <table>
                            <thead>
                                <tr>
                                    <th style="text-align:center;">Звук</th>
                                    <th style="text-align:right;">Іврит</th>
                                    <th>Транскрипція</th>
                                    <th>Переклад</th>
                                </tr>
                            </thead>
                            <tbody>${vocabRows}</tbody>
                        </table>
                    ` : ''}

                    <div class="ornament-divider">• ✡ •</div>
                    <div class="section-title">🧠 Контрольний тест</div>
                    ${quizHtml}
                </div>

                <button class="btn btn-gold" onclick="renderList()" style="width: 100%; text-align: center; padding: 14px;">← Назад до списку уроків</button>
            `;
            window.scrollTo(0, 0);
        }

        function checkAns(btn, isCorrect) {
            const parent = btn.parentElement;
            parent.querySelectorAll(".quiz-opt").forEach(b => b.disabled = true);
            if (isCorrect) {
                btn.classList.add("correct");
            } else {
                btn.classList.add("wrong");
            }
        }

        document.addEventListener("DOMContentLoaded", renderList);
    </script>
</body>
</html>
