<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVRIT PRO — Вивчення івриту</title>
    <style>
        :root {
            --jewish-blue: #0038b8;
            --jewish-gold: #c69214;
            --bg-color: #fcf9f2;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #00227a, var(--jewish-blue));
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-bottom: 5px solid var(--jewish-gold);
            border-radius: 0 0 20px 20px;
        }

        .star-symbol {
            font-size: 28px;
            color: var(--jewish-gold);
            margin-bottom: 5px;
        }

        h1 {
            margin: 5px 0;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .lesson-card {
            background: #ffffff;
            border: 2px solid var(--jewish-gold);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(198, 146, 20, 0.1);
            position: relative;
        }

        .lesson-card::after {
            content: "✡";
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--jewish-blue);
            font-size: 22px;
        }

        .lesson-card h2 {
            color: var(--jewish-blue);
            font-size: 1.3rem;
            margin-top: 0;
        }

        .hebrew-title {
            font-size: 1.2rem;
            color: var(--jewish-gold);
            font-weight: bold;
            direction: rtl;
            text-align: right;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--jewish-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #002a8c;
        }

        .btn-gold {
            background-color: var(--jewish-gold);
            color: #fff;
            font-weight: bold;
        }

        .lesson-content-box {
            background: #ffffff;
            border: 2px solid var(--jewish-gold);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(198, 146, 20, 0.1);
        }

        .section-title {
            color: var(--jewish-blue);
            border-bottom: 2px solid var(--jewish-gold);
            padding-bottom: 6px;
            margin-top: 25px;
            margin-bottom: 12px;
            font-size: 1.2rem;
        }

        .theory-p {
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 3px solid var(--jewish-blue);
            line-height: 1.5;
        }

        .dialogue-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--jewish-gold);
        }

        .he-dialogue {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--jewish-blue);
            direction: rtl;
            text-align: right;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: var(--jewish-blue);
            color: white;
        }

        td.he-col {
            font-weight: bold;
            color: var(--jewish-blue);
            direction: rtl;
            text-align: right;
        }

        .quiz-item {
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #ddd;
        }

        .quiz-opt {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        .quiz-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: bold; }
        .quiz-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }

        footer {
            text-align: center;
            color: #777;
            margin-top: 40px;
            font-size: 0.9rem;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="star-symbol">✡</div>
        <h1>IVRIT PRO</h1>
        <p>Інтерактивний академічний курс івриту</p>
    </header>

    <div class="container" id="app-container">
        <!-- Список уроків завантажиться автоматично -->
    </div>

    <footer>
        <p>&copy; 2026 IVRIT PRO. Усі права захищено.</p>
    </footer>

    <!-- Підключаємо файл з твоїми уроками з кореня (без папки data) -->
    <script src="lessons-data.js"></script>
    <script>
        const container = document.getElementById("app-container");

        function renderList() {
            if (typeof ivritCourses === "undefined" || !Array.isArray(ivritCourses)) {
                container.innerHTML = `<div style="text-align:center; color:red; padding:20px;">Помилка: не вдалося знайти файл <code>lessons-data.js</code> у корені репозиторія.</div>`;
                return;
            }

            let html = "";
            ivritCourses.forEach(lesson => {
                let desc = (lesson.theory && lesson.theory[0]) ? lesson.theory[0] : "Інтерактивний урок івриту.";
                html += `
                    <div class="lesson-card">
                        <h2>${lesson.title}</h2>
                        <div class="hebrew-title">${lesson.hebrewTitle || ''}</div>
                        <p>${desc}</p>
                        <button class="btn" onclick="openLesson(${lesson.id})">Відкрити урок</button>
                    </div>
                `;
            });
            container.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function openLesson(id) {
            const lesson = ivritCourses.find(l => l.id === id);
            if (!lesson) return;

            let theoryHtml = (lesson.theory || []).map(t => `<div class="theory-p">${t}</div>`).join("");
            
            let dialoguesHtml = (lesson.dialogues || []).map(d => `
                <div class="dialogue-box">
                    <div class="he-dialogue">${d.he || d.speaker1}</div>
                    <div style="font-style: italic; color: #555; margin-top: 4px;">${d.tr || ''} — <b>${d.uk || d.translat1 || ''}</b></div>
                </div>
            `).join("");

            let vocabRows = (lesson.vocabulary || []).map(v => `
                <tr>
                    <td class="he-col">${v.he}</td>
                    <td><i>${v.tr}</i></td>
                    <td>${v.uk}</td>
                </tr>
            `).join("");

            let quizHtml = (lesson.quiz && lesson.quiz.length > 0) ? lesson.quiz.map((q, qIdx) => {
                let opts = q.options.map((opt, oIdx) => 
                    `<button class="quiz-opt" onclick="checkAns(this, ${oIdx === q.correct})">${opt}</button>`
                ).join("");
                return `
                    <div class="quiz-item">
                        <p><b>${qIdx + 1}. ${q.question}</b></p>
                        <div>${opts}</div>
                    </div>
                `;
            }).join("") : "<p>У цьому уроці тест у розробці.</p>";

            container.innerHTML = `
                <button class="btn btn-gold" onclick="renderList()" style="margin-bottom: 20px;">← Назад до списку уроків</button>
                
                <div class="lesson-content-box">
                    <h2 style="color: var(--jewish-blue); margin-bottom: 5px;">${lesson.title}</h2>
                    <div class="hebrew-title" style="font-size: 1.3rem; margin-bottom: 15px;">${lesson.hebrewTitle || ''}</div>
                    <p style="color: #666; margin-bottom: 20px;">⏱ Тривалість: ${lesson.duration || '90 хвилин'}</p>
                    
                    <div class="section-title">✡ Теорія та граматика</div>
                    ${theoryHtml}

                    ${dialoguesHtml ? `<div class="section-title">💬 Діалоги та фрази</div>${dialoguesHtml}` : ''}

                    ${vocabRows ? `
                        <div class="section-title">📖 Словник уроку</div>
                        <table>
                            <thead><tr><th>Іврит</th><th>Транскрипція</th><th>Переклад</th></tr></thead>
                            <tbody>${vocabRows}</tbody>
                        </table>
                    ` : ''}

                    <div class="section-title">🧠 Контрольний тест</div>
                    ${quizHtml}
                </div>

                <button class="btn btn-gold" onclick="renderList()" style="width: 100%; text-align: center;">← Назад до списку уроків</button>
            `;
            window.scrollTo(0, 0);
        }

        function checkAns(btn, isCorrect) {
            const parent = btn.parentElement;
            parent.querySelectorAll(".quiz-opt").forEach(b => b.disabled = true);
            if (isCorrect) {
                btn.classList.add("correct");
            } else {
                btn.classList.add("wrong");
            }
        }

        document.addEventListener("DOMContentLoaded", renderList);
    </script>
</body>
</html>
