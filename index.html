<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVRIT PRO — Єврейська академія івриту</title>
    <!-- Підключаємо гарний ізраїльський шрифт Assistant -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --jewish-blue: #0038b8;
            --jewish-gold: #c69214;
            --bg-pergamum: #fcf6ec; /* Теплий пергаментний фон */
            --card-border: #e6d2b5;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-pergamum);
            /* Додаємо ледь помітну текстуру традиційного фону */
            background-image: radial-gradient(#e6d2b5 0.75px, transparent 0.75px);
            background-size: 16px 16px;
            color: #2c3e50;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #001f6b, var(--jewish-blue));
            color: white;
            text-align: center;
            padding: 35px 20px;
            border-bottom: 6px solid var(--jewish-gold);
            border-radius: 0 0 25px 25px;
            box-shadow: 0 6px 20px rgba(0, 56, 184, 0.3);
        }

        .star-symbol {
            font-size: 32px;
            color: var(--jewish-gold);
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
            font-weight: 700;
        }

        header p {
            margin-top: 8px;
            font-size: 1.1rem;
            opacity: 0.95;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 800px;
            margin: 35px auto;
            padding: 0 15px;
        }

        .lesson-card {
            background: #ffffff;
            border: 2px solid var(--jewish-gold);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 6px 18px rgba(198, 146, 20, 0.12);
            position: relative;
            transition: transform 0.2s;
        }

        .lesson-card:hover {
            transform: translateY(-2px);
        }

        .lesson-card::after {
            content: "✡";
            position: absolute;
            top: 18px;
            right: 20px;
            color: var(--jewish-blue);
            font-size: 24px;
            opacity: 0.85;
        }

        .lesson-card h2 {
            color: var(--jewish-blue);
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 6px;
            padding-right: 30px;
        }

        .hebrew-title {
            font-size: 1.3rem;
            color: var(--jewish-gold);
            font-weight: 700;
            direction: rtl;
            text-align: right;
            margin-bottom: 12px;
        }

        .btn {
            background-color: var(--jewish-blue);
            color: white;
            border: none;
            padding: 11px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-family: 'Assistant', sans-serif;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-top: 12px;
            box-shadow: 0 3px 10px rgba(0, 56, 184, 0.2);
        }

        .btn:hover {
            background-color: #002a8c;
        }

        .btn-gold {
            background-color: var(--jewish-gold);
            color: #fff;
            font-weight: 700;
        }
        .btn-gold:hover {
            background-color: #b08110;
        }

        .lesson-content-box {
            background: #ffffff;
            border: 2px solid var(--jewish-gold);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 6px 18px rgba(198, 146, 20, 0.12);
        }

        .section-title {
            color: var(--jewish-blue);
            border-bottom: 2px solid var(--jewish-gold);
            padding-bottom: 8px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theory-p {
            margin-bottom: 12px;
            padding-left: 12px;
            border-left: 4px solid var(--jewish-blue);
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .dialogue-box {
            background: #fdfaf4;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid var(--jewish-gold);
            border-top: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
        }

        .he-dialogue {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--jewish-blue);
            direction: rtl;
            text-align: right;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            text-align: left;
        }

        th {
            background-color: var(--jewish-blue);
            color: white;
            font-size: 1.05rem;
        }

        td.he-col {
            font-weight: 700;
            color: var(--jewish-blue);
            direction: rtl;
            text-align: right;
            font-size: 1.2rem;
        }

        .quiz-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--card-border);
        }

        .quiz-opt {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 15px;
            margin: 8px 0;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-family: 'Assistant', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .quiz-opt:hover {
            background: #f4eee1;
            border-color: var(--jewish-blue);
        }

        .quiz-opt.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: bold; }
        .quiz-opt.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }

        footer {
            text-align: center;
            color: #8c7b60;
            margin-top: 40px;
            font-size: 0.95rem;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="star-symbol">✡</div>
        <h1>IVRIT PRO</h1>
        <p>Єврейський академічний курс івриту</p>
    </header>

    <div class="container" id="app-container">
        <!-- Список уроків завантажиться автоматично -->
    </div>

    <footer>
        <p>&copy; 2026 IVRIT PRO. Усі права захищено.</p>
    </footer>

    <!-- Підключаємо твій файл з уроками з кореня -->
    <script src="lessons-data.js"></script>
    <script>
        const container = document.getElementById("app-container");

        function renderList() {
            if (typeof ivritCourses === "undefined" || !Array.isArray(ivritCourses)) {
                container.innerHTML = `<div style="text-align:center; color:red; padding:20px;">Помилка: не вдалося знайти файл <code>lessons-data.js</code>.</div>`;
                return;
            }

            let html = "";
            ivritCourses.forEach(lesson => {
                let desc = (lesson.theory && lesson.theory[0]) ? lesson.theory[0] : "Інтерактивний урок івриту.";
                html += `
                    <div class="lesson-card">
                        <h2>${lesson.title}</h2>
                        <div class="hebrew-title">${lesson.hebrewTitle || ''}</div>
                        <p style="color: #444; font-size: 1.05rem;">${desc}</p>
                        <button class="btn" onclick="openLesson(${lesson.id})">Відкрити урок</button>
                    </div>
                `;
            });
            container.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function openLesson(id) {
            const lesson = ivritCourses.find(l => l.id === id);
            if (!lesson) return;

            let theoryHtml = (lesson.theory || []).map(t => `<div class="theory-p">${t}</div>`).join("");
            
            let dialoguesHtml = (lesson.dialogues || []).map(d => `
                <div class="dialogue-box">
                    <div class="he-dialogue">${d.he || d.speaker1}</div>
                    <div style="font-style: italic; color: #555; margin-top: 6px; font-size: 1rem;">${d.tr || ''} — <b>${d.uk || d.translat1 || ''}</b></div>
                </div>
            `).join("");

            let vocabRows = (lesson.vocabulary || []).map(v => `
                <tr>
                    <td class="he-col">${v.he}</td>
                    <td><i>${v.tr}</i></td>
                    <td>${v.uk}</td>
                </tr>
            `).join("");

            let quizHtml = (lesson.quiz && lesson.quiz.length > 0) ? lesson.quiz.map((q, qIdx) => {
                let opts = q.options.map((opt, oIdx) => 
                    `<button class="quiz-opt" onclick="checkAns(this, ${oIdx === q.correct})">${opt}</button>`
                ).join("");
                return `
                    <div class="quiz-item">
                        <p><b>${qIdx + 1}. ${q.question}</b></p>
                        <div>${opts}</div>
                    </div>
                `;
            }).join("") : "<p style='color: #666; font-style: italic;'>У цьому уроці тестові завдання готуються до публікації.</p>";

            container.innerHTML = `
                <button class="btn btn-gold" onclick="renderList()" style="margin-bottom: 20px;">← Назад до списку уроків</button>
                
                <div class="lesson-content-box">
                    <h2 style="color: var(--jewish-blue); margin-bottom: 5px; font-size: 1.5rem;">${lesson.title}</h2>
                    <div class="hebrew-title" style="font-size: 1.4rem; margin-bottom: 15px;">${lesson.hebrewTitle || ''}</div>
                    <p style="color: #666; margin-bottom: 25px; font-weight: 600;">⏱ Тривалість: ${lesson.duration || '90 хвилин'}</p>
                    
                    <div class="section-title">✡ Теорія та граматика</div>
                    ${theoryHtml}

                    ${dialoguesHtml ? `<div class="section-title">💬 Діалоги та фрази</div>${dialoguesHtml}` : ''}

                    ${vocabRows ? `
                        <div class="section-title">📖 Словник уроку</div>
                        <table>
                            <thead><tr><th>Іврит</th><th>Транскрипція</th><th>Переклад</th></tr></thead>
                            <tbody>${vocabRows}</tbody>
                        </table>
                    ` : ''}

                    <div class="section-title">🧠 Контрольний тест</div>
                    ${quizHtml}
                </div>

                <button class="btn btn-gold" onclick="renderList()" style="width: 100%; text-align: center; padding: 12px;">← Назад до списку уроків</button>
            `;
            window.scrollTo(0, 0);
        }

        function checkAns(btn, isCorrect) {
            const parent = btn.parentElement;
            parent.querySelectorAll(".quiz-opt").forEach(b => b.disabled = true);
            if (isCorrect) {
                btn.classList.add("correct");
            } else {
                btn.classList.add("wrong");
            }
        }

        document.addEventListener("DOMContentLoaded", renderList);
    </script>
</body>
</html>
